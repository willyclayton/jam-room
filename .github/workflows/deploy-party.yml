# Redeploys the PartyKit room server whenever its code changes on main.
# Needs two repository secrets: PARTYKIT_LOGIN (your GitHub username) and
# PARTYKIT_TOKEN (from `npx partykit token generate`). Skips if they're missing.
name: Deploy room server

on:
  push:
    branches: [main]
    paths:
      - "party/**"
      - "lib/**"
      - "partykit.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
      PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.PARTYKIT_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.PARTYKIT_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.PARTYKIT_TOKEN != ''
      - run: npm test
        if: env.PARTYKIT_TOKEN != ''
      - run: npx partykit deploy
        if: env.PARTYKIT_TOKEN != ''
      - run: echo "PARTYKIT_TOKEN secret not set; skipping deploy."
        if: env.PARTYKIT_TOKEN == ''
